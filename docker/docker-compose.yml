version: '3.8'

services:
  osint-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: osint-bot
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../logs:/app/logs
      - ../data:/app/data
    networks:
      - osint-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  osint-network:
    driver: bridge
